<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; }
        .sidebar { background: #0b1120; border-left: 1px solid rgba(255,255,255,0.05); }
        .node-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .node-card:hover { border-color: #6366f1; background: rgba(30, 41, 59, 0.6); }
        .link-line { position: absolute; left: 24px; width: 2px; }
        .link-solid { top: -32px; height: 32px; background: #334155; }
        .link-dash { top: -40px; height: 40px; border-left: 2px dashed #ef4444; }
        .tag-jump { position: absolute; left: 10px; top: 12px; font-size: 8px; color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="flex justify-end h-screen text-slate-300">

    <aside class="w-[380px] sidebar flex flex-col p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xs font-bold text-white tracking-[0.2em] uppercase">Narrative Flow</h2>
            <div class="px-2 py-1 bg-green-500/10 text-green-500 text-[10px] rounded border border-green-500/20">校验通过</div>
        </div>

        <div class="flex-1 overflow-y-auto space-y-10 pr-2">
            
            <div class="node-card p-4 relative border-indigo-500/40">
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-indigo-600 rounded flex items-center justify-center text-white text-[10px]"><i class="fas fa-home"></i></div>
                        <div>
                            <h4 class="text-xs font-bold text-white">起始场景</h4>
                            <p class="text-[9px] text-slate-500 mt-0.5">ID: Index_Home</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="node-card p-4 relative">
                <div class="link-line link-solid"></div>
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-slate-700 rounded flex items-center justify-center text-white text-[10px]">2</div>
                        <div>
                            <h4 class="text-xs font-bold text-white">详情查看按钮</h4>
                            <p class="text-[9px] text-slate-500 mt-0.5">Page: Index_Home</p>
                        </div>
                    </div>
                    <button onclick="openModal('详情查看按钮', '系统录制的自动描述内容...')" class="text-slate-500 hover:text-indigo-400 transition"><i class="fas fa-cog text-[11px]"></i></button>
                </div>
                <div class="mt-3 h-12 bg-black/40 rounded border border-white/5 flex items-center justify-center text-[9px] text-slate-700 italic">Snapshot Preview</div>
            </div>

            <div class="node-card p-4 relative">
                <div class="link-line link-dash">
                    <div class="tag-jump">静默跳转</div>
                </div>
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-slate-700 rounded flex items-center justify-center text-white text-[10px]">3</div>
                        <div>
                            <h4 class="text-xs font-bold text-white">关闭弹窗</h4>
                            <p class="text-[9px] text-slate-500 mt-0.5">Page: Detail_View</p>
                        </div>
                    </div>
                    <button onclick="openModal('关闭弹窗', '在详情页执行关闭操作')" class="text-slate-500 hover:text-indigo-400 transition"><i class="fas fa-cog text-[11px]"></i></button>
                </div>
            </div>

        </div>

        <button class="mt-6 w-full bg-indigo-600 py-3 rounded-xl font-bold text-xs shadow-lg shadow-indigo-500/20 active:scale-95 transition">
            保存叙事序列
        </button>
    </aside>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-white/10 w-[360px] rounded-2xl shadow-2xl">
            <div class="p-5 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider">节点配置</h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] text-slate-500 uppercase font-bold">节点名称 (可修改)</label>
                    <input id="node-name" type="text" class="w-full bg-black/30 border border-white/10 p-2 rounded text-xs text-white outline-none focus:border-indigo-500">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] text-slate-500 uppercase font-bold">节点描述 (可修改)</label>
                    <textarea id="node-desc" rows="2" class="w-full bg-black/30 border border-white/10 p-2 rounded text-xs text-white outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="pt-2 border-t border-white/5 space-y-2 opacity-60">
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">底层录制数据 (Read-only)</p>
                    <div class="flex justify-between text-[9px]">
                        <span class="text-slate-500 uppercase">操作类型</span>
                        <span class="text-slate-300">CLICK_POPUP</span>
                    </div>
                    <div class="flex justify-between text-[9px]">
                        <span class="text-slate-500 uppercase">绑定控点 ID</span>
                        <span class="text-slate-300 font-mono">btn_092_close</span>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-white/5 flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-2 text-xs text-slate-400 font-bold">取消</button>
                <button onclick="closeModal()" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">确认保存</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(name, desc) {
            document.getElementById('node-name').value = name;
            document.getElementById('node-desc').value = desc;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
