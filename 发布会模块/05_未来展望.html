<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景演示大师1.0 - 未来展望</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 苹果发布会暗黑主题配色 */
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-light: #a1a1a6;
            --accent-color: #8b5cf6;
            --accent-light: #a78bfa;
            --border-color: #2c2c2e;
            --section-padding: 60px 20px;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow-x: hidden;
        }

        /* Section Styles */
        section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: var(--section-padding);
            background-color: var(--bg-color);
        }

        .section-inner {
            max-width: 1200px;
            width: 100%;
        }

        /* Title Styles */
        h2 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-color);
            text-align: center;
            letter-spacing: -0.01em;
        }

        h5 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 20px 0 10px;
            color: var(--text-color);
            text-align: left;
        }

        /* Content Styles */
        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-light);
            line-height: 1.7;
            text-align: center;
        }

        .intro-text {
            font-size: 1.3rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 60px;
            color: var(--text-light);
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 4px;
            background: var(--accent-color);
            margin: 40px auto;
            border-radius: 2px;
        }

        /* Feature List */
        .feature-list {
            max-width: 800px;
            margin: 40px auto;
            list-style: none;
        }

        .feature-item {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item h5 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .feature-item h5::before {
            content: "•";
            color: var(--accent-color);
            font-size: 1.5rem;
            line-height: 1;
        }

        .value-desc {
            text-align: left;
            color: var(--accent-light);
            font-size: 0.95rem;
            padding: 15px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
        }

        .value-desc strong {
            color: var(--accent-color);
        }

        /* Footer Section */
        .footer {
            border-top: 1px solid var(--border-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h2 {
                font-size: 2rem;
            }

            h5 {
                font-size: 1rem;
            }

            .intro-text {
                font-size: 1.1rem;
            }

            section {
                padding: 40px 20px;
            }

            .feature-item {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Future Vision -->
        <section id="future">
            <div class="section-inner">
                <h2>未来展望</h2>
                <div class="divider"></div>
                <p class="intro-text">持续优化产品体验，引领行业发展</p>
                
                <div class="feature-list">
                    <div class="feature-item">
                        <h5>提升编辑效率，进一步降低创作门槛</h5>
                        <div class="value-desc">
                            <strong>客户价值：</strong>通过辅助功能和AI能力，让用户更快、更轻松地创建高质量场景
                        </div>
                    </div>
                    <div class="feature-item">
                        <h5>丰富展示形式，增强业务场景化表达能力</h5>
                        <div class="value-desc">
                            <strong>客户价值：</strong>引入更多交互效果和媒体类型，满足多样化展示需求，提升场景吸引力
                        </div>
                    </div>
                    <div class="feature-item">
                        <h5>加强数字资产管理能力，优化团队协作流程</h5>
                        <div class="value-desc">
                            <strong>客户价值：</strong>提升数字资产利用率，增强团队协作效率，满足企业日益增长的需求
                        </div>
                    </div>
                    <div class="feature-item">
                        <h5>拓展行业应用，提供更精准的业务场景解决方案</h5>
                        <div class="value-desc">
                            <strong>客户价值：</strong>针对不同行业提供定制化解决方案，深入挖掘行业需求，提升产品适用性
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Conclusion -->
        <section class="footer">
            <div class="section-inner">
                <h2>场景演示大师1.0</h2>
                <div class="divider"></div>
                <p>展厅多媒体交互场景编辑器的全新升级</p>
                <p>让我们共同创造更精彩的多媒体交互体验</p>
            </div>
        </section>
    </div>
</body>
</html>
