<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景演示大师 - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(63, 63, 70, 0.5); }
        .active-node { border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .nav-tab.active { color: #3b82f6; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div class="flex justify-between px-6 pt-2 text-xs font-bold">
        <span>12:00</span>
        <div class="flex gap-1">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <header class="flex items-center justify-between p-4 mt-2">
        <button class="text-xl"><i class="fas fa-bars"></i></button>
        <h1 class="text-lg font-medium">场景演示大师</h1>
        <button class="text-xl text-blue-500"><i class="fas fa-rotate"></i></button>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-2">
        <div class="mb-6">
            <h2 class="text-sm text-zinc-400 mb-1 flex items-center gap-2">
                <i class="fas fa-chevron-left"></i> XXXX场景 - xxx叙事线
            </h2>
        </div>

        <div class="space-y-4 relative">
            <div class="absolute left-[20px] top-6 bottom-6 w-0.5 bg-zinc-700 -z-10"></div>

            <div class="glass rounded-xl p-4 ml-2 border-l-4 border-l-zinc-500">
                <div class="text-xs text-zinc-500 mb-1">起始</div>
                <div class="font-bold mb-1">项目导入阶段</div>
                <p class="text-xs text-zinc-400 leading-relaxed">展示场景初始化数据，完成环境光影载入及资源预热描述文字...</p>
            </div>

            <div class="glass rounded-xl p-4 ml-2 active-node">
                <div class="flex justify-between">
                    <span class="text-xs text-blue-500 mb-1 font-bold">1</span>
                    <span class="text-[10px] bg-blue-600 px-2 rounded-full">进行中</span>
                </div>
                <div class="font-bold mb-1">核心交互展示</div>
                <p class="text-xs text-zinc-300 leading-relaxed">当前正在演示核心叙事逻辑，包含实时动态捕捉与数据可视化看板。</p>
            </div>

            <div class="glass rounded-xl p-4 ml-2 opacity-50">
                <div class="text-xs text-zinc-500 mb-1">2</div>
                <div class="font-bold mb-1">数据总结</div>
                <p class="text-xs text-zinc-500 italic">待触发...</p>
            </div>
        </div>
    </main>

    <section class="glass rounded-t-3xl p-6 space-y-4 shadow-2xl">
        <div class="flex gap-4">
            <button class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-xl font-bold transition">上一步</button>
            <button class="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition">下一步</button>
        </div>
        
        <div class="h-[1px] bg-zinc-800 w-full my-2"></div>

        <div class="flex justify-between gap-2">
            <button class="flex-1 py-2 text-xs border border-zinc-700 rounded-lg">实时预览</button>
            <button class="flex-1 py-2 text-xs border border-zinc-700 rounded-lg">场景导航</button>
            <button class="flex-1 py-2 text-xs border border-blue-500/50 text-blue-400 bg-blue-500/10 rounded-lg">
                <i class="fas fa-expand mr-1"></i>全屏
            </button>
        </div>
    </section>

    <nav class="flex justify-around items-center py-3 bg-black safe-area-bottom">
        <div class="nav-tab active flex flex-col items-center gap-1">
            <i class="fas fa-th-large text-xl"></i>
            <span class="text-[10px]">内容中心</span>
        </div>
        
        <div class="relative -top-6">
            <div class="bg-blue-600 w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-[#09090b]">
                <i class="fas fa-qrcode text-2xl text-white"></i>
            </div>
            <span class="text-[10px] absolute -bottom-5 left-1/2 -translate-x-1/2 w-max text-zinc-400">扫一扫</span>
        </div>

        <div class="nav-tab text-zinc-500 flex flex-col items-center gap-1">
            <i class="fas fa-user text-xl"></i>
            <span class="text-[10px]">我的</span>
        </div>
    </nav>

</body>
</html>
