<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景演示大师 - 首页</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-blue: #2563eb;
            --card-bg: #111111;
            --border-color: #222222;
            --text-dim: #666666;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景装饰：深色渐变和微弱网格 */
        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 600px;
            text-align: center;
        }

        /* 顶部 Logo 区 */
        .brand {
            margin-bottom: 80px;
        }
        .brand h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p {
            color: var(--accent-blue);
            font-size: 12px;
            letter-spacing: 5px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* 主按钮：扫码连接 */
        .main-cta {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .main-cta:hover {
            border-color: var(--accent-blue);
            transform: translateY(-8px);
            background: #161616;
        }

        .main-cta:active {
            transform: translateY(-2px);
        }

        /* 扫码图标的抽象表现 */
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-box::after {
            content: "";
            width: 70%;
            height: 2px;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            position: absolute;
            animation: scanLoop 2s infinite ease-in-out;
        }

        @keyframes scanLoop {
            0% { top: 20%; }
            50% { top: 75%; }
            100% { top: 20%; }
        }

        .cta-text h2 {
            font-size: 24px;
            margin: 0;
            font-weight: 500;
        }
        .cta-text p {
            color: var(--text-dim);
            font-size: 15px;
            margin-top: 10px;
        }

        /* 底部 ID 连接区 */
        .secondary-action {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .id-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        .id-link:hover {
            color: white;
            border-bottom: 1px solid white;
        }

        /* 设备状态 */
        .device-info {
            position: absolute;
            bottom: 40px;
            width: 100%;
            left: 0;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 12px;
            color: #333;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="container">
        <header class="brand">
            <h1>场景演示大师</h1>
            <p>Master Terminal Pad</p>
        </header>

        <div class="main-cta" onclick="alert('正在调起摄像头...')">
            <div class="icon-box">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                    <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" stroke-linecap="round"/>
                    <rect x="7" y="7" width="3" height="3" fill="white"/>
                    <rect x="14" y="14" width="3" height="3" fill="white"/>
                </svg>
            </div>
            <div class="cta-text">
                <h2>扫码连接大屏</h2>
                <p>识别大屏展示的二维码以同步控制内容</p>
            </div>
        </div>

        <div class="secondary-action">
            <a class="id-link">使用会话 ID 手动连接</a>
        </div>
    </div>

    <div class="device-info">
        <span><span class="status-dot"></span>系统已就绪</span>
        <span>|</span>
        <span>当前网络: Office_Secure_5G</span>
        <span>|</span>
        <span>版本 1.2.4</span>
    </div>
</body>
</html>
